<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fraud Alert Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: { 600: '#4f46e5', 700: '#4338ca', 800: '#3730a3' }
          }
        }
      }
    }
  </script>
  <style>
    .stat-card { transition: transform .15s, box-shadow .15s; }
    .stat-card:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(0,0,0,.12); }
  </style>
</head>
<body class="bg-gray-50 min-h-screen flex">

  <!-- Sidebar -->
  <aside class="w-56 bg-gray-900 text-gray-100 flex flex-col py-6 px-4 min-h-screen shrink-0">
    <div class="flex items-center gap-2 mb-8 px-1">
      <svg class="w-7 h-7 text-indigo-400" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round"
          d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"/>
      </svg>
      <span class="font-bold text-sm tracking-wide">FraudGuard</span>
    </div>
    <nav class="flex flex-col gap-1 text-sm">
      <a th:href="@{/}" class="flex items-center gap-3 px-3 py-2 rounded-lg bg-indigo-600 text-white font-medium">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/>
        </svg>
        Dashboard
      </a>
      <a id="all-alerts-link" th:href="@{/alerts}" class="flex items-center gap-3 px-3 py-2 rounded-lg hover:bg-gray-700 text-gray-300 hover:text-white transition-colors">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/>
        </svg>
        All Alerts
      </a>
      <a id="new-alert-link" th:href="@{/alerts/new}" class="flex items-center gap-3 px-3 py-2 rounded-lg hover:bg-gray-700 text-gray-300 hover:text-white transition-colors">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4"/>
        </svg>
        New Alert
      </a>
      <a th:href="@{/exceptions}" class="flex items-center gap-3 px-3 py-2 rounded-lg hover:bg-gray-700 text-gray-300 hover:text-white transition-colors">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v2m0 4h.01M5.07 19H19a2 2 0 001.75-2.96l-7-12a2 2 0 00-3.5 0l-7 12A2 2 0 005.07 19z"/>
        </svg>
        Exceptions
      </a>
    </nav>
  </aside>

  <!-- Main content -->
  <main class="flex-1 p-8">
    <header class="mb-8">
      <h1 class="text-2xl font-bold text-gray-800">Dashboard Overview</h1>
      <p class="text-gray-500 text-sm mt-1">Monitor and manage fraud alerts in real time</p>
    </header>

    <!-- Stat cards -->
    <div class="cards grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5 gap-5">

      <!-- Total -->
      <a id="indicator-total" th:href="@{/alerts}"
         class="stat-card block bg-white rounded-xl border border-gray-200 p-5 shadow-sm hover:border-indigo-400 no-underline">
        <div class="flex items-center justify-between mb-3">
          <span class="text-xs font-semibold text-gray-500 uppercase tracking-wide">Total Alerts</span>
          <span class="w-8 h-8 rounded-full bg-indigo-50 flex items-center justify-center">
            <svg class="w-4 h-4 text-indigo-500" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/>
            </svg>
          </span>
        </div>
        <span class="count block text-3xl font-bold text-gray-800" th:text="${total}">0</span>
      </a>

      <!-- Per-status cards -->
      <a class="stat-card block bg-white rounded-xl border border-gray-200 p-5 shadow-sm hover:border-indigo-400 no-underline"
         th:each="entry : ${counts}"
         th:id="'indicator-' + ${entry.key}"
         th:href="@{/alerts(status=${entry.key})}">
        <div class="flex items-center justify-between mb-3">
          <span class="text-xs font-semibold text-gray-500 uppercase tracking-wide" th:text="${entry.key}">STATUS</span>
          <span class="w-8 h-8 rounded-full bg-blue-50 flex items-center justify-center">
            <svg class="w-4 h-4 text-blue-400" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <circle cx="12" cy="12" r="9"/><path stroke-linecap="round" d="M12 7v5l3 3"/>
            </svg>
          </span>
        </div>
        <span class="count block text-3xl font-bold text-gray-800" th:text="${entry.value}">0</span>
      </a>

      <!-- Exceptions -->
      <a id="indicator-exceptions" th:href="@{/exceptions}"
         class="stat-card block bg-red-50 rounded-xl border border-red-200 p-5 shadow-sm hover:border-red-400 no-underline">
        <div class="flex items-center justify-between mb-3">
          <span class="text-xs font-semibold text-red-600 uppercase tracking-wide">Exceptions</span>
          <span class="w-8 h-8 rounded-full bg-red-100 flex items-center justify-center">
            <svg class="w-4 h-4 text-red-500" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v2m0 4h.01M5.07 19H19a2 2 0 001.75-2.96l-7-12a2 2 0 00-3.5 0l-7 12A2 2 0 005.07 19z"/>
            </svg>
          </span>
        </div>
        <span class="count block text-3xl font-bold text-red-700" th:text="${exceptionCount}">0</span>
      </a>

    </div>
  </main>
</body>
</html>
