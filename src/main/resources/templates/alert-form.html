<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Add Fraud Alert</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen flex">

  <!-- Sidebar -->
  <aside class="w-56 bg-gray-900 text-gray-100 flex flex-col py-6 px-4 min-h-screen shrink-0">
    <div class="flex items-center gap-2 mb-8 px-1">
      <svg class="w-7 h-7 text-indigo-400" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round"
          d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"/>
      </svg>
      <span class="font-bold text-sm tracking-wide">FraudGuard</span>
    </div>
    <nav class="flex flex-col gap-1 text-sm">
      <a th:href="@{/}" class="flex items-center gap-3 px-3 py-2 rounded-lg hover:bg-gray-700 text-gray-300 hover:text-white transition-colors">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/>
        </svg>
        Dashboard
      </a>
      <a th:href="@{/alerts}" class="flex items-center gap-3 px-3 py-2 rounded-lg hover:bg-gray-700 text-gray-300 hover:text-white transition-colors">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/>
        </svg>
        All Alerts
      </a>
      <a th:href="@{/alerts/new}" class="flex items-center gap-3 px-3 py-2 rounded-lg bg-indigo-600 text-white font-medium">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4"/>
        </svg>
        New Alert
      </a>
      <a th:href="@{/exceptions}" class="flex items-center gap-3 px-3 py-2 rounded-lg hover:bg-gray-700 text-gray-300 hover:text-white transition-colors">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v2m0 4h.01M5.07 19H19a2 2 0 001.75-2.96l-7-12a2 2 0 00-3.5 0l-7 12A2 2 0 005.07 19z"/>
        </svg>
        Exceptions
      </a>
      <a sec:authorize="hasRole('ADMIN')" th:href="@{/users}"
         class="flex items-center gap-3 px-3 py-2 rounded-lg hover:bg-gray-700 text-gray-300 hover:text-white transition-colors">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0z"/>
        </svg>
        Users
      </a>
    </nav>
    <div class="mt-auto pt-4 border-t border-gray-700">
      <p class="text-xs text-gray-400 px-3 mb-2" sec:authentication="name">username</p>
      <form th:action="@{/logout}" method="post">
        <button type="submit"
                class="w-full flex items-center gap-3 px-3 py-2 rounded-lg hover:bg-gray-700 text-gray-400 hover:text-white text-sm transition-colors text-left">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/>
          </svg>
          Sign out
        </button>
      </form>
    </div>
  </aside>

  <!-- Main content -->
  <main class="flex-1 p-8 flex items-start justify-center">
    <div class="w-full max-w-lg">
      <header class="mb-6">
        <h1 class="text-2xl font-bold text-gray-800">Add Fraud Alert</h1>
        <p class="text-gray-500 text-sm mt-0.5">Fill in the details below to log a new fraud alert</p>
      </header>

      <div class="bg-white rounded-xl border border-gray-200 shadow-sm p-6">
        <form id="alert-form" th:action="@{/alerts}" th:object="${alert}" method="post" class="flex flex-col gap-5">

          <!-- Transaction ID -->
          <div>
            <label for="transactionId" class="block text-sm font-semibold text-gray-700 mb-1">Transaction ID</label>
            <input type="text" th:field="*{transactionId}"
                   class="w-full px-3 py-2 text-sm border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-400"
                   placeholder="e.g. TXN-00123">
            <span class="error block mt-1 text-xs text-red-600" id="transactionId-error"
                  th:if="${#fields.hasErrors('transactionId')}" th:errors="*{transactionId}"></span>
          </div>

          <!-- Customer name -->
          <div>
            <label for="customerName" class="block text-sm font-semibold text-gray-700 mb-1">Customer Name</label>
            <input type="text" th:field="*{customerName}"
                   class="w-full px-3 py-2 text-sm border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-400"
                   placeholder="Full name">
            <span class="error block mt-1 text-xs text-red-600" id="customerName-error"
                  th:if="${#fields.hasErrors('customerName')}" th:errors="*{customerName}"></span>
          </div>

          <!-- Amount -->
          <div>
            <label for="amount" class="block text-sm font-semibold text-gray-700 mb-1">Amount</label>
            <div class="relative">
              <span class="absolute left-3 top-1/2 -translate-y-1/2 text-gray-400 text-sm">$</span>
              <input type="number" step="0.01" th:field="*{amount}"
                     class="w-full pl-7 pr-3 py-2 text-sm border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-400"
                     placeholder="0.00">
            </div>
            <span class="error block mt-1 text-xs text-red-600" id="amount-error"
                  th:if="${#fields.hasErrors('amount')}" th:errors="*{amount}"></span>
          </div>

          <!-- Risk level -->
          <div>
            <label for="riskLevel" class="block text-sm font-semibold text-gray-700 mb-1">Risk Level</label>
            <select th:field="*{riskLevel}"
                    class="w-full px-3 py-2 text-sm border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-400">
              <option value="">-- select --</option>
              <option th:each="r : ${riskLevels}" th:value="${r}" th:text="${r}"></option>
            </select>
            <span class="error block mt-1 text-xs text-red-600" id="riskLevel-error"
                  th:if="${#fields.hasErrors('riskLevel')}" th:errors="*{riskLevel}"></span>
          </div>

          <!-- Status -->
          <div>
            <label for="status" class="block text-sm font-semibold text-gray-700 mb-1">Status</label>
            <select th:field="*{status}"
                    class="w-full px-3 py-2 text-sm border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-400">
              <option th:each="s : ${statuses}" th:value="${s}" th:text="${s}"></option>
            </select>
            <span class="error block mt-1 text-xs text-red-600" id="status-error"
                  th:if="${#fields.hasErrors('status')}" th:errors="*{status}"></span>
          </div>

          <!-- Reason -->
          <div>
            <label for="reason" class="block text-sm font-semibold text-gray-700 mb-1">Reason</label>
            <input type="text" th:field="*{reason}"
                   class="w-full px-3 py-2 text-sm border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-400"
                   placeholder="Brief description of the fraud reason">
            <span class="error block mt-1 text-xs text-red-600" id="reason-error"
                  th:if="${#fields.hasErrors('reason')}" th:errors="*{reason}"></span>
          </div>

          <!-- Due date -->
          <div>
            <label for="dueDate" class="block text-sm font-semibold text-gray-700 mb-1">Due Date</label>
            <input type="date" th:field="*{dueDate}"
                   class="w-full px-3 py-2 text-sm border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-400">
            <span class="error block mt-1 text-xs text-red-600" id="dueDate-error"
                  th:if="${#fields.hasErrors('dueDate')}" th:errors="*{dueDate}"></span>
          </div>

          <!-- Actions -->
          <div class="flex items-center gap-3 pt-2 border-t border-gray-100">
            <button id="save-button" type="submit"
                    class="px-5 py-2 bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-semibold rounded-lg transition-colors shadow-sm">
              Save Alert
            </button>
            <a id="cancel-link" th:href="@{/alerts}"
               class="px-5 py-2 bg-gray-100 hover:bg-gray-200 text-gray-600 text-sm font-medium rounded-lg transition-colors">
              Cancel
            </a>
          </div>

        </form>
      </div>
    </div>
  </main>
</body>
</html>
