<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Fraud Alerts</title>
<style>
  body { font-family: Arial, sans-serif; margin: 2rem; }
  table { border-collapse: collapse; width: 100%; margin-top: 12px; }
  th, td { border: 1px solid #ccc; padding: 6px 10px; text-align: left; }
  th { background: #f0f0f0; }
  .message { color: #1b6e2d; font-weight: bold; }
  #search-form input, #search-form select { padding: 6px; margin-right: 6px; }
</style>
</head>
<body>
<h1>Fraud Alerts</h1>
<p>
  <a id="dashboard-link" th:href="@{/}">Dashboard</a> |
  <a id="new-alert-link" th:href="@{/alerts/new}">Add new alert</a> |
  <a id="exceptions-link" th:href="@{/exceptions}">Exceptions</a>
</p>
<p id="success-message" class="message" th:if="${message}" th:text="${message}"></p>

<form id="search-form" th:action="@{/alerts}" method="get">
  <input type="text" id="q" name="q" th:value="${q}" placeholder="Transaction ID or customer">
  <select id="status" name="status">
    <option value="">All statuses</option>
    <option th:each="s : ${statuses}" th:value="${s}" th:text="${s}" th:selected="${s == status}"></option>
  </select>
  <select id="risk" name="risk">
    <option value="">All risk levels</option>
    <option th:each="r : ${riskLevels}" th:value="${r}" th:text="${r}" th:selected="${r == risk}"></option>
  </select>
  <button id="search-button" type="submit">Search</button>
  <a id="clear-link" th:href="@{/alerts}">Clear</a>
</form>
<p id="result-count" th:text="${#lists.size(alerts)} + ' alert(s) shown'"></p>

<table id="alert-table" th:unless="${#lists.isEmpty(alerts)}">
  <thead>
    <tr>
      <th>Transaction ID</th>
      <th>Customer</th>
      <th>Amount</th>
      <th>Risk level</th>
      <th>Status</th>
      <th>Due date</th>
      <th>Created</th>
    </tr>
  </thead>
  <tbody>
    <tr th:each="a : ${alerts}">
      <td th:text="${a.transactionId}"></td>
      <td th:text="${a.customerName}"></td>
      <td th:text="${a.amount}"></td>
      <td th:text="${a.riskLevel}"></td>
      <td th:text="${a.status}"></td>
      <td th:text="${a.dueDate}"></td>
      <td th:text="${a.createdAt}"></td>
    </tr>
  </tbody>
</table>
<p id="no-alerts" th:if="${#lists.isEmpty(alerts)}">No alerts found.</p>
</body>
</html>
