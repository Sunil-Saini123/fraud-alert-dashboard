<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Alert Exceptions</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .badge-HIGH    { background:#fee2e2; color:#b91c1c; border:1px solid #fca5a5; }
    .badge-MEDIUM  { background:#fef3c7; color:#b45309; border:1px solid #fcd34d; }
    .badge-LOW     { background:#dcfce7; color:#15803d; border:1px solid #86efac; }

    .status-NEW         { background:#dbeafe; color:#1d4ed8; border:1px solid #93c5fd; }
    .status-UNDER_REVIEW{ background:#ede9fe; color:#6d28d9; border:1px solid #c4b5fd; }
    .status-ESCALATED   { background:#ffedd5; color:#c2410c; border:1px solid #fdba74; }
    .status-CLOSED      { background:#f3f4f6; color:#4b5563; border:1px solid #d1d5db; }

    tbody tr:hover { background: #fff7f7; }
  </style>
</head>
<body class="bg-gray-50 min-h-screen flex">

  <!-- Sidebar -->
  <aside class="w-56 bg-gray-900 text-gray-100 flex flex-col py-6 px-4 min-h-screen shrink-0">
    <div class="flex items-center gap-2 mb-8 px-1">
      <svg class="w-7 h-7 text-indigo-400" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round"
          d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"/>
      </svg>
      <span class="font-bold text-sm tracking-wide">FraudGuard</span>
    </div>
    <nav class="flex flex-col gap-1 text-sm">
      <a id="dashboard-link" th:href="@{/}" class="flex items-center gap-3 px-3 py-2 rounded-lg hover:bg-gray-700 text-gray-300 hover:text-white transition-colors">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/>
        </svg>
        Dashboard
      </a>
      <a id="all-alerts-link" th:href="@{/alerts}" class="flex items-center gap-3 px-3 py-2 rounded-lg hover:bg-gray-700 text-gray-300 hover:text-white transition-colors">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/>
        </svg>
        All Alerts
      </a>
      <a th:href="@{/alerts/new}" class="flex items-center gap-3 px-3 py-2 rounded-lg hover:bg-gray-700 text-gray-300 hover:text-white transition-colors">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4"/>
        </svg>
        New Alert
      </a>
      <a th:href="@{/exceptions}" class="flex items-center gap-3 px-3 py-2 rounded-lg bg-red-700 text-white font-medium">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v2m0 4h.01M5.07 19H19a2 2 0 001.75-2.96l-7-12a2 2 0 00-3.5 0l-7 12A2 2 0 005.07 19z"/>
        </svg>
        Exceptions
      </a>
      <a sec:authorize="hasRole('ADMIN')" th:href="@{/users}"
         class="flex items-center gap-3 px-3 py-2 rounded-lg hover:bg-gray-700 text-gray-300 hover:text-white transition-colors">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0z"/>
        </svg>
        Users
      </a>
    </nav>
    <div class="mt-auto pt-4 border-t border-gray-700">
      <p class="text-xs text-gray-400 px-3 mb-2" sec:authentication="name">username</p>
      <form th:action="@{/logout}" method="post">
        <button type="submit"
                class="w-full flex items-center gap-3 px-3 py-2 rounded-lg hover:bg-gray-700 text-gray-400 hover:text-white text-sm transition-colors text-left">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/>
          </svg>
          Sign out
        </button>
      </form>
    </div>
  </aside>

  <!-- Main content -->
  <main class="flex-1 p-8">
    <header class="mb-6">
      <div class="flex items-center gap-3 mb-1">
        <span class="w-8 h-8 rounded-full bg-red-100 flex items-center justify-center">
          <svg class="w-4 h-4 text-red-600" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v2m0 4h.01M5.07 19H19a2 2 0 001.75-2.96l-7-12a2 2 0 00-3.5 0l-7 12A2 2 0 005.07 19z"/>
          </svg>
        </span>
        <h1 class="text-2xl font-bold text-gray-800">Alert Exceptions</h1>
      </div>
      <p class="text-gray-500 text-sm ml-11">High-risk alerts and overdue alerts that are not closed.</p>
    </header>

    <!-- Exceptions table -->
    <div class="bg-white rounded-xl border border-red-100 shadow-sm overflow-hidden">
      <table id="exception-table" class="w-full text-sm" th:unless="${#lists.isEmpty(alerts)}">
        <thead>
          <tr class="bg-red-50 border-b border-red-100 text-left">
            <th class="px-4 py-3 font-semibold text-gray-600">Transaction ID</th>
            <th class="px-4 py-3 font-semibold text-gray-600">Customer</th>
            <th class="px-4 py-3 font-semibold text-gray-600">Amount</th>
            <th class="px-4 py-3 font-semibold text-gray-600">Risk Level</th>
            <th class="px-4 py-3 font-semibold text-gray-600">Status</th>
            <th class="px-4 py-3 font-semibold text-gray-600">Due Date</th>
          </tr>
        </thead>
        <tbody class="divide-y divide-red-50">
          <tr th:each="a : ${alerts}" class="transition-colors">
            <td class="px-4 py-3 font-mono text-gray-700 text-xs" th:text="${a.transactionId}"></td>
            <td class="px-4 py-3 text-gray-800 font-medium" th:text="${a.customerName}"></td>
            <td class="px-4 py-3 text-gray-700 font-semibold" th:text="${'$' + a.amount}"></td>
            <td class="px-4 py-3">
              <span class="inline-block px-2 py-0.5 rounded-full text-xs font-semibold"
                    th:classappend="'badge-' + ${a.riskLevel}"
                    th:text="${a.riskLevel}">HIGH</span>
            </td>
            <td class="px-4 py-3">
              <span class="inline-block px-2 py-0.5 rounded-full text-xs font-semibold"
                    th:classappend="'status-' + ${a.status}"
                    th:text="${a.status}">NEW</span>
            </td>
            <td class="px-4 py-3 text-gray-600" th:text="${a.dueDate}"></td>
          </tr>
        </tbody>
      </table>
      <p id="no-exceptions" th:if="${#lists.isEmpty(alerts)}"
         class="text-center py-12 text-gray-400 text-sm">No exceptions found.</p>
    </div>
  </main>
</body>
</html>
