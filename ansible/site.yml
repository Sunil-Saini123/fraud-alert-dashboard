---
- name: Configure the Fraud Alert Review Dashboard server
  hosts: app_servers
  become: true

  vars:
    app_name: fraud-alert-dashboard
    app_user: fraudapp
    app_group: fraudapp
    app_home: /opt/fraud-alert-dashboard
    app_data: /var/lib/fraud-alert-dashboard
    app_log: /var/log/fraud-alert-dashboard
    app_port: 8081
    java_opts: "-Xms128m -Xmx384m"
    packages:
      - openjdk-21-jre-headless
      - curl

  tasks:
    - name: Install required packages
      ansible.builtin.apt:
        name: "{{ packages }}"
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: Create the application group
      ansible.builtin.group:
        name: "{{ app_group }}"
        system: true

    - name: Create the application user
      ansible.builtin.user:
        name: "{{ app_user }}"
        group: "{{ app_group }}"
        system: true
        shell: /usr/sbin/nologin
        home: "{{ app_home }}"
        create_home: false

    - name: Create the application folders
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: directory
        owner: "{{ app_user }}"
        group: "{{ app_group }}"
        mode: "{{ item.mode }}"
      loop:
        - { path: "{{ app_home }}", mode: "0755" }
        - { path: "{{ app_home }}/releases", mode: "0755" }
        - { path: "{{ app_data }}", mode: "0750" }
        - { path: "{{ app_log }}", mode: "0750" }

    - name: Install the environment file (port and Java options)
      ansible.builtin.template:
        src: fraud-alert-dashboard.env.j2
        dest: "/etc/{{ app_name }}.env"
        owner: root
        group: "{{ app_group }}"
        mode: "0640"

    - name: Install the systemd service unit
      ansible.builtin.template:
        src: fraud-alert-dashboard.service.j2
        dest: "/etc/systemd/system/{{ app_name }}.service"
        owner: root
        group: root
        mode: "0644"
      notify: Reload systemd

    - name: Apply systemd changes now
      ansible.builtin.meta: flush_handlers

    - name: Enable the service at boot (it is started after the first deployment)
      ansible.builtin.systemd:
        name: "{{ app_name }}"
        enabled: true

    - name: Read the installed Java version
      ansible.builtin.command: java -version
      register: java_version
      changed_when: false

    - name: Show the installed Java version
      ansible.builtin.debug:
        msg: "{{ java_version.stderr_lines }}"

  handlers:
    - name: Reload systemd
      ansible.builtin.systemd:
        daemon_reload: true
